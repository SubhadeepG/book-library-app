<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <link rel="stylesheet" href="book.css">
    <script src="book_code.js" defer></script>
</head>
<body>
    <header>
        <h1>Library</h1>
    </header>
    <div class="button-container">
        <button id="book-button">+ Add Book</button>
    </div>
    <div class="container">
        
    </div>
    <div class="form-container">
        <button id="close-btn">X</button>
        <h1>New book</h1>
        <div class="form-header">
        </div>
        <form action="#Home" method="post">
            <input type="text" placeholder="Title" id="book_title">
            <input type="text" placeholder="Author" id="author_name">
            <input type="text" placeholder="Pages" id="number_of_pages">
            <div class="read-checkbox">
                <label for="read_checkbox">Read: </label>
                <input type="checkbox" id="read_checkbox">
            </div>
        </form>
        <button id="submit-btn">Add</button>
    </div>
</body>
</html>
